<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post Not Found - CaloTrek</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f5f5f5;
      color: #333;
    }
    .card {
      background: white;
      padding: 30px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      border-radius: 12px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
    }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Oops! This page is not available</h1>
    <p id="message">You may have opened a shared post link without the CaloTrek app installed.</p>
    <a href="https://play.google.com/store/apps/details?id=com.appdocdeveloper.calotrek" class="button">Install CaloTrek App</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.has("id")) {
      const postId = params.get("id");
      document.getElementById("message").innerHTML =
        `This shared post (<code>${postId}</code>) requires the CaloTrek app to view.`;
    }
  </script>
</body>
</html>
